<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sayeed Video Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #07110d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      width: 100%;
      max-width: 650px;
      padding: 24px;
      border: 1px solid #1f4d39;
      border-radius: 22px;
      background: #0c1913;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: #a8b8b0;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #19d77b;
      color: #041009;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #07100c;
      color: #b8c9c0;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .player {
      display: none;
      margin-top: 20px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎬 Sayeed Video Lab</h1>

    <p>
      Telegram Video Streaming — Proof of Concept
    </p>

    <button onclick="loadVideo()">
      ▶ PLAY TEST VIDEO
    </button>

    <div id="status">
      Ready for testing...
    </div>

    <div class="player" id="playerBox">
      <video
        id="videoPlayer"
        controls
        playsinline
        preload="metadata">
      </video>
    </div>

  </div>

  <script>
    async function loadVideo() {

      const status = document.getElementById("status");
      const playerBox = document.getElementById("playerBox");
      const videoPlayer = document.getElementById("videoPlayer");

      status.textContent = "🔄 Finding Telegram video...";

      try {

        const response = await fetch("/api/telegram");

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Telegram request failed");
        }

        if (!data.video || !data.video.file_id) {
          throw new Error("No Telegram video found.");
        }

        const fileId = data.video.file_id;

        status.textContent =
          "✅ Video found!\n\n" +
          "Loading video player...";

        /*
         * Important:
         * The Telegram Bot Token stays on the server.
         * The browser only receives this internal
         * Sayeed Video Lab endpoint.
         */

        const videoUrl =
          "/api/video?file_id=" +
          encodeURIComponent(fileId);

        videoPlayer.src = videoUrl;

        playerBox.style.display = "block";

        videoPlayer.load();

        status.textContent =
          "✅ Telegram video connected.\n\n" +
          "Press Play to start.";

      } catch (error) {

        status.textContent =
          "❌ Error:\n\n" +
          error.message;
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sayeed Video Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #07110d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      padding: 28px;
      border: 1px solid #1f4d39;
      border-radius: 22px;
      background: #0c1913;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      color: #a8b8b0;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #19d77b;
      color: #041009;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #07100c;
      color: #b8c9c0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎬 Sayeed Video Lab</h1>

    <p>
      Telegram Video Streaming — Proof of Concept
    </p>

    <button onclick="checkTelegram()">
      CHECK TEST VIDEO
    </button>

    <div id="status">
      Ready for testing...
    </div>
  </div>

  <script>
    async function checkTelegram() {
      const status = document.getElementById("status");

      status.textContent = "Checking Telegram...";

      try {
        const response = await fetch("/api/telegram");

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        if (data.video) {
          status.textContent =
            "✅ Telegram video detected!\n\n" +
            "File ID:\n" +
            data.video.file_id +
            "\n\nFile Size:\n" +
            data.video.file_size +
            " bytes";
        } else {
          status.textContent =
            "⚠️ No video post detected yet.\n\n" +
            JSON.stringify(data, null, 2);
        }

      } catch (error) {
        status.textContent =
          "❌ Error:\n\n" + error.message;
      }
    }
  </script>

</body>
</html>

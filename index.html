<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sayeed Video Lab</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07110d;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;

      padding: 18px 16px;

      background: rgba(7, 17, 13, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08);

      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .sub {
      margin-top: 4px;
      color: #8fa99c;
      font-size: 13px;
    }

    .container {
      width: min(100%, 700px);
      margin: auto;
      padding: 18px 14px 40px;
    }

    .status {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      color: #b8c9c0;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .course {
      margin-bottom: 24px;
    }

    .course-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .module {
      margin-top: 10px;
    }

    .module-title {
      color: #91b5a4;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .video-card {
      display: flex;
      align-items: center;
      gap: 13px;

      padding: 14px;
      margin-bottom: 9px;

      border-radius: 15px;

      background: #102019;
      border: 1px solid rgba(255,255,255,0.07);

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease;
    }

    .video-card:active {
      transform: scale(0.98);
    }

    .play {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #39d98a;
      color: #06140d;

      font-size: 18px;
      font-weight: 900;
    }

    .video-info {
      min-width: 0;
      flex: 1;
    }

    .video-title {
      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-meta {
      margin-top: 5px;

      color: #84988e;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #84988e;
    }

    .player-page {
      display: none;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      border: 0;
      background: transparent;

      color: white;
      font-size: 15px;
      font-weight: 700;

      padding: 8px 0;
      margin-bottom: 14px;

      cursor: pointer;
    }

    .player-box {
      width: 100%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
      background: #000;
    }

    .now-playing {
      margin-top: 15px;
    }

    .now-title {
      font-size: 19px;
      font-weight: 800;
    }

    .now-meta {
      margin-top: 7px;
      color: #84988e;
      font-size: 13px;
      line-height: 1.5;
    }

    .loader {
      text-align: center;
      padding: 40px 10px;
      color: #8fa99c;
    }

    .error {
      padding: 15px;
      border-radius: 12px;

      background: rgba(255,70,70,0.10);
      border: 1px solid rgba(255,70,70,0.2);

      color: #ff9b9b;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      Sayeed Video Lab
    </div>

    <div class="sub">
      Your video library
    </div>
  </header>


  <main class="container">

    <!-- LIBRARY PAGE -->

    <section id="libraryPage">

      <div id="status" class="status">
        Loading video library...
      </div>

      <div id="library"></div>

    </section>


    <!-- PLAYER PAGE -->

    <section
      id="playerPage"
      class="player-page"
    >

      <button
        class="back"
        onclick="showLibrary()"
      >
        ← Back to Library
      </button>

      <div class="player-box">

        <video
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
        ></video>

      </div>

      <div class="now-playing">

        <div
          id="nowTitle"
          class="now-title"
        ></div>

        <div
          id="nowMeta"
          class="now-meta"
        ></div>

      </div>

    </section>

  </main>


  <script>

    // ============================================
    // RENDER BACKEND
    // ============================================

    const API_BASE =
      "https://sayeed-video-lab.onrender.com";


    // ============================================
    // ELEMENTS
    // ============================================

    const libraryPage =
      document.getElementById(
        "libraryPage"
      );

    const playerPage =
      document.getElementById(
        "playerPage"
      );

    const library =
      document.getElementById(
        "library"
      );

    const status =
      document.getElementById(
        "status"
      );

    const videoPlayer =
      document.getElementById(
        "videoPlayer"
      );

    const nowTitle =
      document.getElementById(
        "nowTitle"
      );

    const nowMeta =
      document.getElementById(
        "nowMeta"
      );


    // ============================================
    // LOAD LIBRARY
    // ============================================

    async function loadLibrary() {

      try {

        status.textContent =
          "Loading video library...";

        const response =
          await fetch(
            `${API_BASE}/library`
          );

        if (!response.ok) {
          throw new Error(
            "Library request failed."
          );
        }

        const data =
          await response.json();

        if (
          !data.success
        ) {
          throw new Error(
            data.error ||
            "Unable to load library."
          );
        }

        if (
          !data.videos ||
          data.videos.length === 0
        ) {

          status.textContent =
            "No videos found.";

          return;
        }

        status.textContent =
          `${data.count} videos available`;

        renderLibrary(
          data.videos
        );

      } catch (error) {

        console.error(error);

        status.innerHTML = `
          <div class="error">
            ${escapeHtml(
              error.message
            )}
          </div>
        `;
      }
    }


    // ============================================
    // RENDER LIBRARY
    // ============================================

    function renderLibrary(
      videos
    ) {

      library.innerHTML = "";

      const courses = {};


      // GROUP BY COURSE

      videos.forEach(
        (video) => {

          const course =
            video.metadata.course ||
            "Other";

          const module =
            video.metadata.module ||
            "General";

          if (
            !courses[course]
          ) {

            courses[course] = {};

          }

          if (
            !courses[course][module]
          ) {

            courses[course][module] = [];

          }

          courses[course][module]
            .push(video);

        }
      );


      // BUILD UI

      Object.entries(
        courses
      ).forEach(
        ([
          courseName,
          modules
        ]) => {

          const courseElement =
            document.createElement(
              "section"
            );

          courseElement.className =
            "course";

          courseElement.innerHTML = `
            <div class="course-title">
              ${escapeHtml(
                courseName
              )}
            </div>
          `;


          Object.entries(
            modules
          ).forEach(
            ([
              moduleName,
              moduleVideos
            ]) => {

              const moduleElement =
                document.createElement(
                  "div"
                );

              moduleElement.className =
                "module";


              moduleElement.innerHTML = `
                <div class="module-title">
                  Module ${escapeHtml(
                    moduleName
                  )}
                </div>
              `;


              moduleVideos.forEach(
                (video) => {

                  const card =
                    document.createElement(
                      "div"
                    );

                  card.className =
                    "video-card";


                  const title =
                    video.metadata.title ||
                    video.metadata.videoId ||
                    "Untitled Video";


                  const size =
                    formatSize(
                      video.file.size
                    );


                  card.innerHTML = `
                    <div class="play">
                      ▶
                    </div>

                    <div class="video-info">

                      <div class="video-title">
                        ${escapeHtml(
                          title
                        )}
                      </div>

                      <div class="video-meta">
                        ${escapeHtml(
                          video.metadata.videoId ||
                          ""
                        )}
                        •
                        ${size}
                      </div>

                    </div>
                  `;


                  card.addEventListener(
                    "click",
                    () => {

                      openVideo(
                        video
                      );

                    }
                  );


                  moduleElement.appendChild(
                    card
                  );

                }
              );


              courseElement.appendChild(
                moduleElement
              );

            }
          );


          library.appendChild(
            courseElement
          );

        }
      );
    }


    // ============================================
    // OPEN VIDEO
    // ============================================

    function openVideo(
      video
    ) {

      const messageId =
        video.messageId;

      if (!messageId) {
        return;
      }


      const videoUrl =
        `${API_BASE}/video?messageId=${encodeURIComponent(
          messageId
        )}`;


      libraryPage.style.display =
        "none";

      playerPage.style.display =
        "block";


      nowTitle.textContent =
        video.metadata.title ||
        video.metadata.videoId ||
        "Video";


      nowMeta.textContent =
        `${video.metadata.course || ""} • ` +
        `Module ${video.metadata.module || ""} • ` +
        `${formatSize(video.file.size)}`;


      videoPlayer.pause();

      videoPlayer.src =
        videoUrl;

      videoPlayer.load();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    // ============================================
    // SHOW LIBRARY
    // ============================================

    function showLibrary() {

      videoPlayer.pause();

      videoPlayer.removeAttribute(
        "src"
      );

      videoPlayer.load();

      playerPage.style.display =
        "none";

      libraryPage.style.display =
        "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    // ============================================
    // FILE SIZE
    // ============================================

    function formatSize(
      bytes
    ) {

      if (
        !bytes ||
        bytes <= 0
      ) {
        return "Unknown size";
      }

      const units = [
        "B",
        "KB",
        "MB",
        "GB",
        "TB"
      ];

      let size =
        Number(bytes);

      let index = 0;

      while (
        size >= 1024 &&
        index <
          units.length - 1
      ) {

        size /= 1024;

        index++;

      }

      return (
        size.toFixed(
          index === 0
            ? 0
            : 1
        ) +
        " " +
        units[index]
      );
    }


    // ============================================
    // HTML ESCAPE
    // ============================================

    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    // ============================================
    // START
    // ============================================

    loadLibrary();

  </script>

</body>
</html>
